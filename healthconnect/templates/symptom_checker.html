{% extends 'base.html' %}

{% block title %}Symptom Checker{% endblock %}

{% block content %}
<h2>Symptom Checker</h2>
<form id="symptom-form">
    <label for="symptom-input">Describe your symptoms:</label>
    <textarea id="symptom-input" name="symptoms" required></textarea>
    <button type="submit">Check Symptoms</button>
</form>
<div id="recommendations"></div>

<script>
    document.getElementById("symptom-form").addEventListener("submit", function(event) {
        event.preventDefault();
        const symptoms = document.getElementById("symptom-input").value;

        fetch('/symptom_checker/', {
            method: 'POST',
            body: JSON.stringify({ symptoms: symptoms }),
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')  // CSRF token for security
            },
        })
        .then(response => response.json())
        .then(data => {
            const recommendationsDiv = document.getElementById("recommendations");
            recommendationsDiv.innerHTML = '<h3>Recommendations:</h3><ul>' +
                data.recommendations.map(rec => `<li>${rec}</li>`).join('') +
                '</ul>';
        });
    });
    
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                // Check if this cookie string begins with the name we want
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
{% endblock %}
